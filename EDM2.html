<!DOCTYPE html>
<html lang="en">
<head>
	<title>EDM 2 - FireJojoBoy</title>
	<meta name="description" content="THE EDM 2 PROJECT">
	<meta name="keywords" content="FireJojoBoy, Album, EDM2">
	<meta name="author" content="FireJojoBoy">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/styleEDM2.css">
</head>
<body>
	<div id="EDM2wrapper">
		<img src="img/EDM2/EDM2Logo_notext_siteready.svg" id="EDM2logo">
		<div id="countdown">EDM 2</div>
	</div>
	<div id="countdown" style="font-size:2em;"></div>
</body>
<script>
	// Countdown date
	var countDownDate = new Date("Jun 18, 2005 18:32:00").getTime();
	var flashToggle = false;

	var countdownEl = document.getElementById("countdown");

	// Set up smooth fade for reverting only
	document.body.style.transition = "background-color 0.5s ease";
	countdownEl.style.transition = "color 0.5s ease";

	// Update every second
	var x = setInterval(function(){

	  var now = new Date().getTime();
	  var distance = countDownDate - now;

	  // Time calculations
	  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
	  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
	  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
	  var seconds = Math.floor((distance % (1000 * 60)) / 1000);

	  // Display countdown
	  countdownEl.innerHTML = days + "d " + hours + "h " + minutes + "m " + seconds + "s ";

	  // flash1
	  flashToggle = !flashToggle;
	  if(flashToggle){
		document.body.style.transition = "none"; // transition b4 flash
		document.body.style.backgroundColor = "rgba(255, 0, 0, 0.9)";
		countdownEl.style.transition = "none";
		countdownEl.style.color = "rgba(100, 0, 255, 1)";
	  }else{
		document.body.style.transition = "none";
		document.body.style.backgroundColor = "rgba(100, 0, 255, 0.9)";
		countdownEl.style.transition = "none";
		countdownEl.style.color = "rgba(255, 0, 0, 1)";
	  }

	  // fade out back to normal
	  setTimeout(() => {
		document.body.style.transition = "background-color 0.5s ease";
		countdownEl.style.transition = "color 0.1s ease";
		document.body.style.backgroundColor = "";
		countdownEl.style.color = "";
	  }, 50); // small delay before easing

	  // Countdown finished
	  if (distance < 0) {
		clearInterval(x);
		countdownEl.innerHTML = "EDM 2";
		document.body.style.backgroundColor = "";
		countdownEl.style.color = "";
	  }
	}, 1000);
</script>
